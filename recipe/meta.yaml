{% set name = "iam-units" %}
{% set name_ = "iam_units" %}
{% set version = "2025.9.12" %}
{% set hash = "b928e2a894e4df384a72284e42e922745b1b82b553bd78dc101e235f9bbc6614" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name_ }}/{{ name_ }}-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - pint

test:
  requires:
    - python {{ python_min }}
  imports:
    - iam_units
    - iam_units.emissions

about:
  home: https://github.com/IAMconsortium/units
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Unit definitions for integrated-assessment research
  description: |
    Pint-compatible definitions of energy, climate, and related units, to
    supplement the SI and other units included in Pint's default_en.txt.

extra:
  recipe-maintainers:
    - danielhuppmann
    - khaeru
